<!DOCTYPE html>
<html>
<head>
    <title>Результаты анализа</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Результаты анализа</h1>
    <table>
        <thead>
            <tr>
                <th>Слово</th>
                <th>TF</th>
                <th>IDF</th>
            </tr>
        </thead>
        <tbody>
            {% for result in results %}
            <tr>
                <td>{{ result.word }}</td>
                <td>{{ result.tf|floatformat:4 }}</td>
                <td>{{ result.idf|floatformat:4 }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
